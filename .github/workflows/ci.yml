name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  backend:
    name: Backend (.NET and PostgreSQL)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: washflow_ci
          POSTGRES_USER: washflow_ci
          POSTGRES_PASSWORD: washflow_ci_local_only
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U washflow_ci -d washflow_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v5
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/washflow-dotnet
        with:
          dotnet-version: '10.0.402'
      - name: Restore
        run: dotnet restore WashFlow.sln
      - name: Build
        run: dotnet build WashFlow.sln --configuration Release --no-restore
      - name: Test against PostgreSQL
        env:
          # The fixture creates and drops its own schemas on this job's service.
          WASHFLOW_TEST_POSTGRES: >-
            Host=127.0.0.1;Port=${{ job.services.postgres.ports['5432'] }};Database=washflow_ci;Username=washflow_ci;Password=washflow_ci_local_only
        run: dotnet test WashFlow.sln --configuration Release --no-build --no-restore

  flutter:
    name: Flutter analysis and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.7'
      - name: Resolve dependencies
        run: flutter pub get --enforce-lockfile
      - name: Analyze
        run: flutter analyze --no-pub
      - name: Test
        run: flutter test --no-pub
